
name: Multi Branch CI-CD Pipeline

on:
  push:
    branches:
      - main
      - master
      - dev
      - test
      - feature/login

  workflow_dispatch:

jobs:

  # JOB 1: BUILD
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Display Branch
        run: |
          echo "Building branch: $GITHUB_REF_NAME"

      - name: Build Application
        run: |
          echo "Build started"
          echo "Application build completed"

  # JOB 2: TEST
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Execute Tests
        run: |
          echo "Testing branch: $GITHUB_REF_NAME"
          test -f README.md
          echo "All tests passed"

  # JOB 3: DEPLOY
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    needs: [build, test]

    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Deployment
        run: |
          echo "Deployment started"
          echo "Deploying from main branch"
          echo "Deployment completed successfully"
